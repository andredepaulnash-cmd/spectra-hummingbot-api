name: Spectra Hummingbot API CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spectra-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-position-hold-accounting:
    name: Exact PositionHold Accounting
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/spectra-api.yml

      - name: Install focused test dependency
        run: python -m pip install pytest cryptography

      - name: Compile exact-accounting sources
        run: |
          python -m py_compile \
            utils/position_hold_accounting.py \
            utils/executor_order_provenance.py \
            utils/executor_trade_provenance.py \
            models/executors.py \
            routers/executors.py \
            services/executor_service.py \
            utils/spectra_paper_guard.py \
            services/unified_connector_service.py \
            services/market_data_service.py \
            services/executor_service.py \
            routers/connectors.py \
            routers/portfolio.py \
            routers/accounts.py \
            main.py

      - name: Run dependency-light Spectra accounting contract
        run: |
          pytest -q -c /dev/null \
            test/test_exact_position_hold_accounting_contract.py \
            test/test_exact_position_hold_accounting_wiring.py \
            test/test_executor_order_provenance_contract.py \
            test/test_executor_trade_provenance_contract.py \
            test/test_spectra_paper_guard.py \
            test/test_spectra_paper_connector_service.py \
            test/test_core_compatibility.py \
            test/test_spectra_dispatch_receipt.py

  build-paper-api-image:
    name: Build Spectra paper API container
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build the exact alpha API image
        run: docker build --pull --progress=plain -t spectra-finance/hummingbot-api:local -f Dockerfile .
      - name: Checkout matching Spectra Core alpha helpers
        uses: actions/checkout@v4
        with:
          repository: andredepaulnash-cmd/spectra-finance-core
          ref: alpha/one-command-paper-demo-20261108
          path: spectra-core
      - name: Prepare paper-only runtime configuration
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pyyaml cryptography
          API_USER=spectra_alpha
          API_PASS="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          CONFIG_PASS="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          BROKER_USER="spectra_ci"
          BROKER_PASS="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          BROKER_DASH_PASS="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          cat > .env <<EOF
          API_BIND=127.0.0.1
          DB_BIND=127.0.0.1
          USERNAME=$API_USER
          PASSWORD=$API_PASS
          CONFIG_PASSWORD=$CONFIG_PASS
          BROKER_USERNAME=$BROKER_USER
          BROKER_PASSWORD=$BROKER_PASS
          BROKER_DASHBOARD_PASSWORD=$BROKER_DASH_PASS
          SPECTRA_PAPER_ONLY=true
          SPECTRA_PAPER_CONNECTORS=kraken_paper_trade
          SPECTRA_ALLOW_LIVE_EXECUTION=false
          SPECTRA_REQUIRE_CORE_RECEIPTS=true
          SPECTRA_DISPATCH_POLICY_VERSION=spectra-policy-v1
          EOF
          mkdir -p .emqx bots/credentials/master_account
          chmod 600 .env
          printf 'user_id,password,is_superuser\n%s,%s,false\n' "$BROKER_USER" "$BROKER_PASS" > .emqx/auth-bootstrap.csv
          chmod 700 .emqx
          chmod 644 .emqx/auth-bootstrap.csv
          python spectra-core/scripts/configure_alpha_paper_connector.py --config bots/credentials/master_account/conf_client.yml
          cat > "$RUNNER_TEMP/spectra-core.env" <<'EOF'
          SPECTRA_PAPER_ONLY=true
          SPECTRA_ALLOW_LIVE_EXECUTION=false
          SPECTRA_DISPATCH_POLICY_VERSION=spectra-policy-v1
          EOF
          python spectra-core/scripts/generate_spectra_dispatch_keys.py --core-env "$RUNNER_TEMP/spectra-core.env" --api-env .env
          chmod 600 .env
      - name: Start paper-only API and initialize Kraken paper connector
        shell: bash
        run: |
          sed \
            -e '\|/var/run/docker.sock:/var/run/docker.sock|d' \
            -e '/extra_hosts:/d' \
            -e '/host.docker.internal/d' \
            -e '/host-gateway/d' \
            -e 's/container_name: hummingbot-api/container_name: spectra-ci-hummingbot-api/' \
            -e 's/container_name: hummingbot-broker/container_name: spectra-ci-hummingbot-broker/' \
            -e 's/container_name: hummingbot-postgres/container_name: spectra-ci-hummingbot-postgres/' \
            docker-compose.yml > docker-compose.alpha-ci.yml
          ! grep -Eq 'docker.sock|host.docker.internal|host-gateway' docker-compose.alpha-ci.yml
          docker compose -p spectra-ci -f docker-compose.alpha-ci.yml up -d
          API_AUTH="spectra_alpha:$(sed -n 's/^PASSWORD=//p' .env)"
          for attempt in $(seq 1 180); do
            curl -fsS -u "$API_AUTH" http://127.0.0.1:8000/openapi.json >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS -u "$API_AUTH" http://127.0.0.1:8000/openapi.json >/dev/null || {
            docker compose -p spectra-ci -f docker-compose.alpha-ci.yml logs --tail=200
            exit 1
          }
          for attempt in $(seq 1 180); do
            if curl -fsS -u "$API_AUTH" http://127.0.0.1:8000/spectra/runtime > "$RUNNER_TEMP/spectra-runtime.json"; then
              if python -c 'import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if any(n.endswith("/kraken_paper_trade") for n in d.get("paper_connectors", [])) else 1)' "$RUNNER_TEMP/spectra-runtime.json"; then
                break
              fi
            fi
            sleep 2
          done
          curl -fsS -u "$API_AUTH" http://127.0.0.1:8000/spectra/runtime > "$RUNNER_TEMP/spectra-runtime.json" || {
            docker compose -p spectra-ci -f docker-compose.alpha-ci.yml logs --tail=200
            exit 1
          }
          python - <<'PY'
          import json
          from pathlib import Path
          runtime = json.loads(Path(__import__("os").environ["RUNNER_TEMP"] + "/spectra-runtime.json").read_text())
          assert runtime["mode"] == "PAPER_ONLY", runtime
          assert runtime["paper_only"] is True, runtime
          assert runtime["paper_connectors_only"] is True, runtime
          assert runtime["paper_connector_count"] >= 1, runtime
          assert any(name.endswith("/kraken_paper_trade") for name in runtime["paper_connectors"]), runtime
          assert runtime["live_dispatch_available"] is False, runtime
          print("Verified: Kraken paper connector initialized; live dispatch is unavailable.")
          PY
          curl -fsS -u "$API_AUTH" \
            "http://127.0.0.1:8000/connectors/kraken_paper_trade/trading-rules?trading_pairs=BTC-USD" \
            > "$RUNNER_TEMP/kraken-paper-rules.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          rules = json.loads(Path(os.environ["RUNNER_TEMP"] + "/kraken-paper-rules.json").read_text())
          assert "BTC-USD" in rules, rules
          assert rules["BTC-USD"]["min_order_size"] > 0, rules
          assert rules["BTC-USD"]["supports_limit_orders"] is True, rules
          print("Verified: Kraken paper connector resolves live public market rules through its keyless base connector.")
          PY
          set +e
          curl -sS -u "$API_AUTH" -H "Content-Type: application/json" \
            -d '{"connector_name":"kraken_paper_trade","trading_pair":"BTC-USD","account_name":"master_account","timeout":30}' \
            http://127.0.0.1:8000/market-data/trading-pair/add \
            -o "$RUNNER_TEMP/kraken-paper-pair.json" -w '%{http_code}' \
            > "$RUNNER_TEMP/kraken-paper-pair-status.txt"
          PAIR_STATUS=$(cat "$RUNNER_TEMP/kraken-paper-pair-status.txt")
          set -e
          if [ "$PAIR_STATUS" != "200" ]; then
            echo "Kraken paper trading-pair/add returned HTTP $PAIR_STATUS:"
            cat "$RUNNER_TEMP/kraken-paper-pair.json"
            docker compose -p spectra-ci -f docker-compose.alpha-ci.yml logs --no-color hummingbot-api | tail -n 200
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path(os.environ["RUNNER_TEMP"] + "/kraken-paper-pair.json").read_text())
          assert result["success"] is True, result
          PY
          set +e
          curl -sS -u "$API_AUTH" -H "Content-Type: application/json" \
            -d '{"connector_name":"kraken_paper_trade","trading_pair":"BTC-USD","depth":5}' \
            http://127.0.0.1:8000/market-data/order-book \
            -o "$RUNNER_TEMP/kraken-paper-book.json" -w '%{http_code}' \
            > "$RUNNER_TEMP/kraken-paper-book-status.txt"
          BOOK_STATUS=$(cat "$RUNNER_TEMP/kraken-paper-book-status.txt")
          set -e
          if [ "$BOOK_STATUS" != "200" ]; then
            echo "Kraken paper order-book endpoint returned HTTP $BOOK_STATUS:"
            cat "$RUNNER_TEMP/kraken-paper-book.json"
            docker compose -p spectra-ci -f docker-compose.alpha-ci.yml logs --no-color hummingbot-api | tail -n 160
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          book = json.loads(Path(os.environ["RUNNER_TEMP"] + "/kraken-paper-book.json").read_text())
          assert book["trading_pair"] == "BTC-USD", book
          assert book["bids"] and book["asks"], book
          print("Verified: Kraken paper adapter exposes a live public order book for executor pricing.")
          PY
          grep -q 'SPECTRA_PAPER_ONLY=true' .env
          grep -q 'SPECTRA_ALLOW_LIVE_EXECUTION=false' .env
      - name: Stop paper-only API stack
        if: always()
        run: docker compose -p spectra-ci -f docker-compose.alpha-ci.yml down -v || true
