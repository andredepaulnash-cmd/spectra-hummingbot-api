name: Spectra Hummingbot API CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spectra-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-position-hold-accounting:
    name: Exact PositionHold Accounting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: environment.yml

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest \
            pytest-asyncio \
            fastapi \
            uvicorn \
            boto3 \
            python-dotenv \
            "pandas>=2.3.2" \
            "numba>=0.61.2" \
            "numpy>=2.2.6" \
            "pandas-ta>=0.4.71b" \
            "ta-lib>=0.6.4" \
            "tqdm>=4.67.1" \
            "psutil>=5.9.0" \
            docker \
            hummingbot \
            "geckoterminal-py>=0.3.1" \
            "msgpack>=1.0.5" \
            logfire \
            "logfire[fastapi]" \
            "logfire[system-metrics]" \
            "aiomqtt>=2.0.0" \
            "sqlalchemy>=2.0.0" \
            asyncpg \
            psycopg2-binary \
            greenlet \
            pydantic-settings

      - name: Run Spectra exact accounting regression
        run: pytest -q test/test_exact_position_hold_accounting.py
